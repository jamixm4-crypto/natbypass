<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NatBypass</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🚀%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--text:#c9d1d9;--muted:#8b949e;--green:#238636;--green-h:#2ea043;--red:#da3633;--red-h:#f85149;--blue:#1f6feb;--accent:#58a6ff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Courier New',Courier,monospace;font-size:14px;padding:20px}
.container{max-width:1100px;margin:0 auto}
header{display:flex;align-items:center;gap:15px;margin-bottom:20px;padding-bottom:15px;border-bottom:1px solid var(--border)}
header h1{font-size:1.8em;color:var(--accent)}
header h1 span{color:var(--muted);font-size:0.5em;vertical-align:middle}
.meta{display:flex;flex-wrap:wrap;gap:20px;font-size:0.9em;color:var(--muted)}
.meta b{color:var(--text)}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:16px;margin-bottom:16px}
.panel h2{font-size:1em;margin-bottom:12px;color:var(--accent);text-transform:uppercase;letter-spacing:0.1em}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
th{color:var(--muted);font-weight:normal;font-size:0.85em;text-transform:uppercase}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,0.03)}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:0.8em;font-weight:bold}
.badge.online{background:#1a4a1a;color:#3fb950;border:1px solid #238636}
.badge.offline{background:#4a1a1a;color:#f85149;border:1px solid #da3633}
.badge.avail{background:#1a3a4a;color:var(--accent);border:1px solid var(--blue)}
.badge.unavail{background:#4a1a1a;color:#f85149;border:1px solid var(--red)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{background:var(--green);color:#fff;border:none;padding:7px 14px;cursor:pointer;border-radius:5px;font-family:inherit;font-size:13px;transition:background .2s}
button:hover{background:var(--green-h)}
button.danger{background:var(--red)}
button.danger:hover{background:var(--red-h)}
button.secondary{background:var(--blue)}
button.secondary:hover{background:#388bfd}
select{padding:7px 10px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:5px;font-family:inherit;font-size:13px}
.channels-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.channel-card{background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:12px;display:flex;justify-content:space-between;align-items:center}
.channel-name{font-weight:bold}
.toast{position:fixed;bottom:20px;right:20px;background:#333;color:#fff;padding:10px 18px;border-radius:5px;opacity:0;transition:opacity .3s;z-index:999;max-width:300px}
.toast.show{opacity:1}
.empty{color:var(--muted);text-align:center;padding:20px}
.refresh-info{float:right;color:var(--muted);font-size:0.8em}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🚀 NatBypass <span id="ver"></span></h1>
    <div class="meta">
      <div>Device ID: <b id="hDeviceID">—</b></div>
      <div>Публичный IP: <b id="hPublicIP">—</b></div>
      <div>STUN: <b id="hStun">—</b></div>
      <div>Uptime: <b id="hUptime">—</b></div>
      <div>Канал: <b id="hChannel">—</b></div>
    </div>
  </header>

  <div class="panel">
    <h2>Устройства в сети <span class="refresh-info" id="lastUpdate"></span></h2>
    <table>
      <thead><tr>
        <th>Устройство</th><th>Публичный IP</th><th>STUN адрес</th>
        <th>WireGuard ключ</th><th>WG порт</th><th>Статус</th><th>Последний раз виден</th>
      </tr></thead>
      <tbody id="peersTable"><tr><td class="empty" colspan="7">Загрузка...</td></tr></tbody>
    </table>
  </div>

  <div class="panel">
    <h2>Статус сигнальных каналов</h2>
    <div class="channels-grid" id="channelsGrid"><p class="empty">Загрузка...</p></div>
  </div>

  <div class="panel">
    <h2>Управление</h2>
    <div class="controls">
      <button onclick="refreshIP()">🔄 Обновить IP</button>
      <button class="secondary" onclick="downloadWG()">⬇ WireGuard-конфиг</button>
      <select id="channelSelect">
        <option value="telegram">Telegram</option>
        <option value="mqtt">MQTT</option>
        <option value="webhook">HTTP Webhook</option>
        <option value="dns">DNS TXT</option>
      </select>
      <button onclick="switchChannel()">🔀 Сменить канал</button>
      <button class="danger" onclick="restartDaemon()">⚡ Перезапустить</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
function xhr(method, url, body, cb) {
  var x = new XMLHttpRequest();
  x.open(method, url, true);
  if (body) x.setRequestHeader('Content-Type', 'application/json');
  x.onreadystatechange = function() {
    if (x.readyState === 4) {
      var data = null;
      try { data = JSON.parse(x.responseText); } catch(e) {}
      if (cb) cb(x.status, data);
    }
  };
  x.send(body ? JSON.stringify(body) : null);
}

function toast(msg, dur) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show';
  setTimeout(function(){ t.className = 'toast'; }, dur || 3000);
}

function fmtDate(s) {
  if (!s) return '—';
  var d = new Date(s);
  if (isNaN(d.getTime())) return s;
  return d.toLocaleString('ru-RU');
}

function loadStatus() {
  xhr('GET', '/api/status', null, function(s, d) {
    if (s === 200 && d && d.data) {
      var r = d.data;
      document.getElementById('hDeviceID').textContent = r.device_id || '—';
      document.getElementById('hPublicIP').textContent = r.public_ip || '—';
      document.getElementById('hStun').textContent = r.stun_addr || '—';
      document.getElementById('hUptime').textContent = r.uptime || '—';
      document.getElementById('hChannel').textContent = r.current_channel || '—';
    }
    document.getElementById('lastUpdate').textContent = 'Обновлено: ' + new Date().toLocaleTimeString('ru-RU');
  });
}

function loadPeers() {
  xhr('GET', '/api/peers', null, function(s, d) {
    var tbody = document.getElementById('peersTable');
    if (s !== 200 || !d || !d.data) {
      tbody.innerHTML = '<tr><td colspan="7" class="empty">Ошибка загрузки</td></tr>';
      return;
    }
    var peers = d.data;
    if (!peers || peers.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="empty">Нет устройств в сети</td></tr>';
      return;
    }
    var html = '';
    for (var i = 0; i < peers.length; i++) {
      var p = peers[i];
      var onl = p.online ? '<span class="badge online">ОНЛАЙН</span>' : '<span class="badge offline">ОФЛАЙН</span>';
      var wgKey = p.wg_pub_key ? p.wg_pub_key.substring(0, 16) + '...' : '—';
      html += '<tr><td>' + (p.device_id||'—') + '</td>' +
              '<td>' + (p.public_ip||'—') + '</td>' +
              '<td>' + (p.stun_addr||'—') + '</td>' +
              '<td title="' + (p.wg_pub_key||'') + '">' + wgKey + '</td>' +
              '<td>' + (p.wg_port||'—') + '</td>' +
              '<td>' + onl + '</td>' +
              '<td>' + fmtDate(p.last_seen) + '</td></tr>';
    }
    tbody.innerHTML = html;
  });
}

function loadChannels() {
  xhr('GET', '/api/channel/status', null, function(s, d) {
    var grid = document.getElementById('channelsGrid');
    if (s !== 200 || !d || !d.data) {
      grid.innerHTML = '<p class="empty">Нет данных о каналах</p>';
      return;
    }
    var chs = d.data;
    if (!chs || chs.length === 0) {
      grid.innerHTML = '<p class="empty">Нет каналов</p>';
      return;
    }
    var html = '';
    for (var i = 0; i < chs.length; i++) {
      var c = chs[i];
      var b = c.available ? '<span class="badge avail">ДОСТУПЕН</span>' : '<span class="badge unavail">НЕДОСТУПЕН</span>';
      html += '<div class="channel-card"><span class="channel-name">' + c.name + '</span>' + b + '</div>';
    }
    grid.innerHTML = html;
  });
}

function refreshIP() {
  xhr('POST', '/api/refresh-ip', {}, function(s, d) {
    if (s === 200) { toast('✓ IP обновляется...'); loadStatus(); }
    else { toast('✗ Ошибка обновления IP'); }
  });
}

function downloadWG() {
  window.location.href = '/api/wg/config';
}

function switchChannel() {
  var val = document.getElementById('channelSelect').value;
  if (!val) { toast('Выберите канал'); return; }
  xhr('POST', '/api/channel/switch', {name: val}, function(s, d) {
    if (s === 200) { toast('✓ Канал переключён: ' + val); loadStatus(); loadChannels(); }
    else { toast('✗ Ошибка: ' + (d && d.error ? d.error : 'неизвестная')); }
  });
}

function restartDaemon() {
  if (!confirm('Перезапустить NatBypass?')) return;
  xhr('POST', '/api/restart', {}, function(s, d) {
    if (s === 200) { toast('✓ Сигнал перезапуска отправлен'); }
    else { toast('✗ Ошибка перезапуска'); }
  });
}

function refresh() {
  loadStatus();
  loadPeers();
  loadChannels();
}

refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
