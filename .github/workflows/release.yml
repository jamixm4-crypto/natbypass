name: Release / Publish Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build All Architectures
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $TAG_NAME = "${{ github.ref_name }}"
          $LDFLAGS = "-s -w"

          # 1. Windows Binaries
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          
          # Windows Modern GUI
          go build -trimpath -ldflags="$LDFLAGS -H=windowsgui" -o "release/NatBypass-$TAG_NAME-gui-windows-amd64.exe" ./cmd/natbypass-gui
          Copy-Item "release/NatBypass-$TAG_NAME-gui-windows-amd64.exe" "release/NatBypass-$TAG_NAME.exe" -Force
          Copy-Item "release/NatBypass-$TAG_NAME-gui-windows-amd64.exe" "release/NatBypass.exe" -Force

          # Windows CLI
          go build -trimpath -ldflags="$LDFLAGS" -o "release/natbypass-$TAG_NAME-cli-windows-amd64.exe" ./cmd/natbypass-cli
          Copy-Item "release/natbypass-$TAG_NAME-cli-windows-amd64.exe" "release/natbypass-$TAG_NAME-windows-amd64.exe" -Force

          # Windows Builder GUI
          go build -trimpath -ldflags="$LDFLAGS -H=windowsgui" -o "release/NatBypass-Builder-$TAG_NAME.exe" ./cmd/builder

          # 2. Linux Binaries
          $env:GOOS = "linux"
          $env:GOARCH = "amd64"
          go build -trimpath -ldflags="$LDFLAGS" -o "release/natbypass-$TAG_NAME-linux-amd64" ./cmd/natbypass-cli

          $env:GOARCH = "arm64"
          go build -trimpath -ldflags="$LDFLAGS" -o "release/natbypass-$TAG_NAME-linux-arm64" ./cmd/natbypass-cli

          # 3. Routers (MIPS / MIPSLE)
          $env:GOARCH = "mips"
          $env:GOMIPS = "softfloat"
          go build -trimpath -ldflags="$LDFLAGS" -o "release/natbypass-$TAG_NAME-router-mips" ./cmd/natbypass-cli

          $env:GOARCH = "mipsle"
          $env:GOMIPS = "softfloat"
          go build -trimpath -ldflags="$LDFLAGS" -o "release/natbypass-$TAG_NAME-router-mipsle" ./cmd/natbypass-cli

          # 4. Android
          $env:GOOS = "linux"
          $env:GOARCH = "arm64"
          go build -trimpath -ldflags="$LDFLAGS" -o "release/natbypass-$TAG_NAME-android-arm64" ./cmd/natbypass-cli

          # 5. Copy config template
          Copy-Item "config.yaml.example" "release/config.yaml.example" -Force

          # 6. Build pre-packaged NatBypass-Builder-Toolkit.zip
          New-Item -ItemType Directory -Force -Path "toolkit/natbypass-builder" | Out-Null
          Copy-Item "release/NatBypass-Builder-$TAG_NAME.exe" "toolkit/natbypass-builder/NatBypass-Builder.exe" -Force
          Copy-Item -Recurse -Force cmd, internal, pkg, docs, config.yaml.example, go.mod, go.sum, README.md "toolkit/natbypass-builder/"
          Compress-Archive -Path "toolkit/natbypass-builder" -DestinationPath "release/NatBypass-Builder-Toolkit-$TAG_NAME-windows.zip" -Force
          Remove-Item -Recurse -Force toolkit

          Write-Host "All generated release files:"
          Get-ChildItem release | Select-Object Name, Length

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: release/*
          draft: false
          prerelease: false
          generate_release_notes: true
