name: Release / Publish Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build All Architectures
        run: |
          set -e
          mkdir -p release
          TAG="${GITHUB_REF_NAME}"

          echo "==> Windows: Native Desktop App (Win32 GUI)..."
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w -H=windowsgui" -o "release/NatBypass.exe" ./cmd/natbypass-gui
          cp "release/NatBypass.exe" "release/NatBypass-${TAG}.exe"
          cp "release/NatBypass.exe" "release/natbypass-${TAG}-windows-amd64.exe"

          echo "==> Windows: Router Builder GUI..."
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w -H=windowsgui" -o "release/NatBypass-Builder-${TAG}.exe" ./cmd/builder

          echo "==> Linux x64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o "release/natbypass-${TAG}-linux-amd64" ./cmd/natbypass

          echo "==> Linux ARM64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o "release/natbypass-${TAG}-linux-arm64" ./cmd/natbypass

          echo "==> Router MIPS (Big Endian)..."
          CGO_ENABLED=0 GOOS=linux GOARCH=mips GOMIPS=softfloat go build -trimpath -ldflags="-s -w" -o "release/natbypass-${TAG}-router-mips" ./cmd/natbypass

          echo "==> Router MIPSLE (Keenetic)..."
          CGO_ENABLED=0 GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -trimpath -ldflags="-s -w" -o "release/natbypass-${TAG}-router-mipsle" ./cmd/natbypass

          echo "==> Android ARM64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o "release/natbypass-${TAG}-android-arm64" ./cmd/natbypass

          echo "==> Config template..."
          cp config.yaml.example release/config.yaml.example

          echo "==> NatBypass-Builder-Toolkit.zip..."
          mkdir -p toolkit/natbypass-builder
          cp "release/NatBypass-Builder-${TAG}.exe" toolkit/natbypass-builder/NatBypass-Builder.exe
          cp config.yaml.example toolkit/natbypass-builder/config.yaml.example
          cp README.md toolkit/natbypass-builder/README.md
          python3 -c "import shutil; shutil.make_archive('release/NatBypass-Builder-Toolkit-${TAG}-windows', 'zip', 'toolkit')"
          rm -rf toolkit

          echo "==> All release files:"
          ls -lh release/

      - name: Publish Release via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "${TAG}" || gh release create "${TAG}" \
            --title "NatBypass ${TAG}" \
            --notes "Релиз ${TAG}. Скачайте NatBypass-${TAG}.exe для Windows."
          gh release upload "${TAG}" release/* --clobber
