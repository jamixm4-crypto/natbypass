name: Release / Publish Binaries

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-pipeline
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Upload All Platform Binaries
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build All Release Binaries
        shell: pwsh
        env:
          CGO_ENABLED: '0'
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -eq "main" -or $tag -eq "master" -or [string]::IsNullOrWhiteSpace($tag)) {
              $allTags = git tag -l "v*"
              $latestTag = $allTags | Sort-Object { [version]($_ -replace '^v','') } -Descending | Select-Object -First 1
              if (!$latestTag) { $latestTag = "v1.1.6" }
              $tag = $latestTag
          }
          Write-Host "Building release for tag: $tag"
          Remove-Item -Recurse -Force release -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path release | Out-Null

          Write-Host "==> 1. Building Windows Desktop GUI (NatBypass.exe - Stylish WebView2 Desktop App)..."
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          & go build -trimpath -ldflags="-s -w -H=windowsgui -X main.Version=$tag" -o "release\NatBypass-$tag-windows-amd64.exe" ./cmd/natbypass
          & go build -trimpath -ldflags="-s -w -X main.Version=$tag" -o "release\natbypass-cli-$tag-windows-amd64.exe" ./cmd/natbypass

          Write-Host "==> 2. Building Windows Router Builder GUI..."
          & go build -trimpath -ldflags="-w -H=windowsgui" -o "release\NatBypass-Builder-$tag.exe" ./cmd/builder

          Write-Host "==> 3. Building Linux x64..."
          $env:GOOS = "linux"
          $env:GOARCH = "amd64"
          & go build -trimpath -ldflags="-s -w -X main.Version=$tag" -o "release\natbypass-$tag-linux-amd64" ./cmd/natbypass

          Write-Host "==> 4. Building Linux ARM64..."
          $env:GOARCH = "arm64"
          & go build -trimpath -ldflags="-s -w" -o "release\natbypass-$tag-linux-arm64" ./cmd/natbypass

          Write-Host "==> 5. Building Router MIPS..."
          $env:GOARCH = "mips"
          $env:GOMIPS = "softfloat"
          & go build -trimpath -ldflags="-s -w" -o "release\natbypass-$tag-router-mips" ./cmd/natbypass

          Write-Host "==> 6. Building Router MIPSLE..."
          $env:GOARCH = "mipsle"
          & go build -trimpath -ldflags="-s -w" -o "release\natbypass-$tag-router-mipsle" ./cmd/natbypass

          Write-Host "==> 7. Building Android ARM64 CLI..."
          $env:GOOS = "android"
          $env:GOARCH = "arm64"
          & go build -trimpath -ldflags="-s -w" -o "release\natbypass-$tag-android-arm64" ./cmd/natbypass

          Write-Host "==> 8. Copying config..."
          Copy-Item config.yaml.example release\config.yaml.example -Force

          Write-Host "==> 9. Packaging Toolkit with source..."
          New-Item -ItemType Directory -Force -Path toolkit\natbypass-builder | Out-Null
          Copy-Item "release\NatBypass-Builder-$tag.exe" toolkit\natbypass-builder\NatBypass-Builder.exe -Force
          Copy-Item config.yaml.example toolkit\natbypass-builder\config.yaml.example -Force
          Copy-Item README.md toolkit\natbypass-builder\README.md -Force
          Copy-Item go.mod toolkit\natbypass-builder\go.mod -Force
          Copy-Item go.sum toolkit\natbypass-builder\go.sum -Force
          Copy-Item -Recurse -Force cmd toolkit\natbypass-builder\
          Copy-Item -Recurse -Force internal toolkit\natbypass-builder\
          
          python -c "import shutil; shutil.make_archive('release/NatBypass-Builder-Toolkit-$tag-windows', 'zip', 'toolkit')"
          Remove-Item -Recurse -Force toolkit

          Write-Host "==> All Files in release/:"
          Get-ChildItem -Path release -File | Select-Object Name, Length | Format-Table -AutoSize

      - name: Publish Release via GitHub CLI
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -eq "main" -or $tag -eq "master" -or [string]::IsNullOrWhiteSpace($tag)) {
              $allTags = git tag -l "v*"
              $latestTag = $allTags | Sort-Object { [version]($_ -replace '^v','') } -Descending | Select-Object -First 1
              if (!$latestTag) { $latestTag = "v1.1.6" }
              $tag = $latestTag
          }
          
          # Создаем релиз если еще не существует
          $rel = gh release view $tag 2>$null
          if (!$rel) {
              Write-Host "==> Creating clean release $tag..."
              gh release create $tag --title "NatBypass $tag" --notes "NatBypass $tag — P2P Mesh & AmneziaWG 2.0 Client." --target main
          }

          # Удаляем устаревшие файлы если они присутствовали в релизе
          gh release delete-asset $tag "NatBypass-$tag-Setup.exe" -y 2>$null
          gh release delete-asset $tag "NatBypass-Setup-$tag.exe" -y 2>$null
          gh release delete-asset $tag "natbypass-$tag-windows-amd64.exe" -y 2>$null

          $files = Get-ChildItem -Path release -File
          foreach ($f in $files) {
              Write-Host "==> Uploading $($f.Name) ($([math]::Round($f.Length / 1MB, 2)) MB)..."
              gh release upload $tag $f.FullName --clobber
          }
          
          # Устанавливаем статус Latest
          gh release edit $tag --latest --title "NatBypass $tag" 2>$null
          Write-Host "==> All fresh release files successfully uploaded for $tag!"
