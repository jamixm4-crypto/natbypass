name: Release / Publish Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build All Release Binaries
        shell: pwsh
        env:
          CGO_ENABLED: '0'
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force -Path release | Out-Null

          Write-Host "==> 1. Building Windows GUI (NatBypass.exe)..."
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -trimpath -ldflags="-s -w -H=windowsgui" -o "release/NatBypass-$tag.exe" ./cmd/natbypass-gui
          Copy-Item "release/NatBypass-$tag.exe" "release/natbypass-$tag-windows-amd64.exe" -Force
          Copy-Item "release/NatBypass-$tag.exe" "release/NatBypass.exe" -Force

          Write-Host "==> 2. Building Windows Router Builder GUI..."
          go build -trimpath -ldflags="-s -w -H=windowsgui" -o "release/NatBypass-Builder-$tag.exe" ./cmd/builder

          Write-Host "==> 3. Building Linux x64..."
          $env:GOOS = "linux"
          $env:GOARCH = "amd64"
          go build -trimpath -ldflags="-s -w" -o "release/natbypass-$tag-linux-amd64" ./cmd/natbypass

          Write-Host "==> 4. Building Linux ARM64..."
          $env:GOARCH = "arm64"
          go build -trimpath -ldflags="-s -w" -o "release/natbypass-$tag-linux-arm64" ./cmd/natbypass

          Write-Host "==> 5. Building Router MIPS..."
          $env:GOARCH = "mips"
          $env:GOMIPS = "softfloat"
          go build -trimpath -ldflags="-s -w" -o "release/natbypass-$tag-router-mips" ./cmd/natbypass

          Write-Host "==> 6. Building Router MIPSLE..."
          $env:GOARCH = "mipsle"
          go build -trimpath -ldflags="-s -w" -o "release/natbypass-$tag-router-mipsle" ./cmd/natbypass

          Write-Host "==> 7. Building Android CLI..."
          $env:GOMIPS = ""
          $env:GOARCH = "arm64"
          go build -trimpath -ldflags="-s -w" -o "release/natbypass-$tag-android-arm64" ./cmd/natbypass

          Write-Host "==> 8. Copying config..."
          Copy-Item config.yaml.example release/config.yaml.example -Force

          Write-Host "==> 9. Packaging Toolkit with source..."
          New-Item -ItemType Directory -Force -Path toolkit/natbypass-builder | Out-Null
          Copy-Item "release/NatBypass-Builder-$tag.exe" toolkit/natbypass-builder/NatBypass-Builder.exe -Force
          Copy-Item config.yaml.example toolkit/natbypass-builder/config.yaml.example -Force
          Copy-Item README.md toolkit/natbypass-builder/README.md -Force
          Copy-Item go.mod toolkit/natbypass-builder/go.mod -Force
          Copy-Item go.sum toolkit/natbypass-builder/go.sum -Force
          Copy-Item -Recurse -Force cmd toolkit/natbypass-builder/ -ErrorAction SilentlyContinue
          Copy-Item -Recurse -Force internal toolkit/natbypass-builder/ -ErrorAction SilentlyContinue
          
          Compress-Archive -Path toolkit/natbypass-builder/* -DestinationPath "release/NatBypass-Builder-Toolkit-$tag-windows.zip" -Force
          Remove-Item -Recurse -Force toolkit -ErrorAction SilentlyContinue

          Write-Host "==> All Built Files in release/:"
          Get-ChildItem -Path release -File | Select-Object Name, Length | Format-Table -AutoSize

      - name: Publish Release via GitHub CLI
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release delete $tag --yes 2>$null
          gh release create $tag --title "NatBypass $tag" --notes "Релиз $tag. Скачайте NatBypass-$tag.exe (нативное Win32 GUI приложение) для Windows."
          
          $files = Get-ChildItem -Path release -File
          foreach ($f in $files) {
              Write-Host "==> Uploading $($f.Name) ($([math]::Round($f.Length / 1MB, 2)) MB)..."
              gh release upload $tag $f.FullName --clobber
          }
          Write-Host "==> All release files uploaded successfully!"
