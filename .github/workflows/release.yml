name: Build, Sign and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  actions: write

jobs:
  build-and-sign:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: Compile Windows PE resources
        continue-on-error: true
        env:
          GOPROXY: "https://proxy.golang.org,direct"
        run: |
          go install github.com/tc-hib/go-winres@latest
          $env:PATH = "$((go env GOPATH))\bin;$env:PATH"
          go-winres make --in winres/winres.json --out cmd/natbypass/rsrc
          go-winres make --in winres/winres.json --out cmd/natbypass-cli/rsrc
          go-winres make --in winres/winres.json --out cmd/natbypass-gui/rsrc

      - name: Build Windows Binaries
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: |
          if (Test-Path "build") { Remove-Item -Recurse -Force "build" }
          New-Item -ItemType Directory -Path "build" -Force | Out-Null
          $VERSION = "${{ github.ref_name }}"
          go build -trimpath -ldflags="-s -w -H=windowsgui -X main.Version=$VERSION" -o build/NatBypass.exe ./cmd/natbypass
          go build -trimpath -ldflags="-s -w -H=windowsgui -X main.Version=$VERSION" -o build/NatBypass-GUI.exe ./cmd/natbypass-gui
          go build -trimpath -ldflags="-s -w -X main.Version=$VERSION" -o build/natbypass-cli.exe ./cmd/natbypass-cli
          go build -trimpath -ldflags="-s -w -X main.Version=$VERSION" -o build/NatBypass-Probe.exe ./cmd/natbypass-probe
          Copy-Item scripts/diag.ps1 build/diag.ps1 -Force
          Copy-Item scripts/diag.sh build/diag.sh -Force

      - name: Install Cosign (Sigstore)
        uses: sigstore/cosign-installer@v3

      - name: Sign Windows Binary with Sigstore
        run: |
          cosign sign-blob --yes --output-signature build/NatBypass.exe.sig --output-certificate build/NatBypass.exe.pem build/NatBypass.exe

      - name: Build Linux Cross-Platform Binaries
        env:
          CGO_ENABLED: '0'
          GOOS: linux
        run: |
          $VERSION = "${{ github.ref_name }}"
          $env:GOARCH = "amd64"
          go build -trimpath -ldflags="-s -w -X main.Version=$VERSION" -o build/natbypass-linux-amd64 ./cmd/natbypass
          go build -trimpath -ldflags="-s -w -X main.Version=$VERSION" -o build/natbypass-probe-linux-amd64 ./cmd/natbypass-probe

          $env:GOARCH = "arm64"
          go build -trimpath -ldflags="-s -w -X main.Version=$VERSION" -o build/natbypass-linux-arm64 ./cmd/natbypass
          go build -trimpath -ldflags="-s -w -X main.Version=$VERSION" -o build/natbypass-probe-linux-arm64 ./cmd/natbypass-probe

          $env:GOARCH = "mipsle"
          $env:GOMIPS = "softfloat"
          go build -trimpath -ldflags="-s -w -X main.Version=$VERSION" -o build/natbypass-keenetic-mipsle ./cmd/natbypass
          go build -trimpath -ldflags="-s -w -X main.Version=$VERSION" -o build/natbypass-probe-keenetic-mipsle ./cmd/natbypass-probe
          Copy-Item build/natbypass-keenetic-mipsle build/natbypass-router-mipsle -Force
          Copy-Item build/natbypass-probe-keenetic-mipsle build/natbypass-probe-router-mipsle -Force

          $env:GOARCH = "mips"
          $env:GOMIPS = "softfloat"
          go build -trimpath -ldflags="-s -w -X main.Version=$VERSION" -o build/natbypass-router-mips ./cmd/natbypass

          $env:GOARCH = "arm"
          $env:GOARM = "7"
          go build -trimpath -ldflags="-s -w -X main.Version=$VERSION" -o build/natbypass-openwrt-armv7 ./cmd/natbypass
          Copy-Item build/natbypass-openwrt-armv7 build/natbypass-router-armv7 -Force

      - name: Upload Release Assets via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $TAG = "${{ github.ref_name }}"
          $isPre = $TAG.Contains("-")
          
          # Check if release exists; if not, create as published prerelease/latest
          gh release view $TAG 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) {
            if ($isPre) {
              gh release create $TAG --target "${{ github.sha }}" --title "NatBypass $TAG" --generate-notes --prerelease
            } else {
              gh release create $TAG --target "${{ github.sha }}" --title "NatBypass $TAG" --generate-notes --latest
            }
          }

          # Generate SHA256 checksums for all release binaries and assets
          $binFiles = @(Get-ChildItem -Path "build/*" -File | Where-Object { -not $_.Name.EndsWith(".sha256") -and $_.Name -ne "sha256sums.txt" })
          foreach ($file in $binFiles) {
            $hash = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)" | Set-Content -Path (Join-Path "build" "$($file.Name).sha256") -Encoding ASCII
          }
          $checksumLines = foreach ($file in $binFiles) {
            $hash = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)"
          }
          $checksumLines | Set-Content -Path (Join-Path "build" "sha256sums.txt") -Encoding ASCII

          $files = Get-ChildItem -Path "build/*" -File
          Write-Host "Uploading $($files.Count) assets to release $TAG..."
          foreach ($file in $files) {
            Write-Host "Uploading $($file.Name)..."
            for ($attempt=1; $attempt -le 5; $attempt++) {
              gh release upload $TAG $file.FullName --clobber
              if ($LASTEXITCODE -eq 0) { break }
              Write-Host "Upload attempt $attempt for $($file.Name) failed, retrying in 3s..."
              Start-Sleep -Seconds 3
            }
          }

      - name: Setup Python for manifest generator
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate mirror manifest and commit to repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          python scripts/gen_mirror_manifest.py --tag "${{ github.ref_name }}" --build-dir build --out-dir mirror/releases
          git add mirror/releases/
          $diff = git status --porcelain
          if ($diff) {
            git commit -m "chore(mirror): update release manifests for ${{ github.ref_name }} [skip ci]"
            $pushed = $false
            for ($i = 0; $i -lt 5; $i++) {
              git fetch origin main
              git rebase origin/main
              git push origin main
              if ($LASTEXITCODE -eq 0) {
                $pushed = $true
                break
              }
              Start-Sleep -Seconds 3
            }
            if (-not $pushed) {
              Write-Host "Warning: Could not push mirror manifest (possibly updated by concurrent run). Checking remote..."
              git fetch origin main
              if (Test-Path "mirror/releases/${{ github.ref_name }}.json") {
                Write-Host "Manifest for ${{ github.ref_name }} is already present on remote origin/main. Success."
              } else {
                exit 1
              }
            }
          }

      - name: Prune old workflow runs and historical beta tags
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Write-Host "Pruning completed workflow runs (keeping latest 5)..."
          $runsJson = gh run list --workflow=release.yml --limit 30 --json databaseId,status
          if ($runsJson) {
            $runs = $runsJson | ConvertFrom-Json
            $completedRuns = $runs | Where-Object { $_.status -eq "completed" }
            if ($completedRuns.Count -gt 5) {
              $toDelete = $completedRuns | Select-Object -Skip 5
              foreach ($r in $toDelete) {
                Write-Host "Deleting old workflow run: $($r.databaseId)"
                gh run delete $($r.databaseId) 2>$null
              }
            }
          }

          Write-Host "Checking for old beta tags on remote (keeping latest 3)..."
          $tags = git tag -l "v*-beta*" --sort=-v:refname
          if ($tags.Count -gt 3) {
            $staleTags = $tags | Select-Object -Skip 3
            foreach ($st in $staleTags) {
              Write-Host "Pruning old beta tag from remote: $st"
              git push origin --delete $st 2>$null
              git tag -d $st 2>$null
            }
          }
