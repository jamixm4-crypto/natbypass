name: Release / Publish Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build All Architectures
        run: |
          set -e
          mkdir -p release
          TAG="${GITHUB_REF_NAME}"
          export CGO_ENABLED=0

          echo "==> 1. Building Pure Native Win32 Desktop App..."
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w -H=windowsgui" -o "release/NatBypass.exe" ./cmd/natbypass-gui
          cp "release/NatBypass.exe" "release/NatBypass-${TAG}.exe"
          cp "release/NatBypass.exe" "release/natbypass-${TAG}-windows-amd64.exe"

          echo "==> 2. Building Windows CLI Daemon..."
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o "release/natbypass-cli-${TAG}-windows-amd64.exe" ./cmd/natbypass-cli

          echo "==> 3. Building Router Builder GUI..."
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w -H=windowsgui" -o "release/NatBypass-Builder-${TAG}.exe" ./cmd/builder

          echo "==> 4. Building Linux Binaries..."
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o "release/natbypass-${TAG}-linux-amd64" ./cmd/natbypass-cli
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o "release/natbypass-${TAG}-linux-arm64" ./cmd/natbypass-cli

          echo "==> 5. Building Router MIPS Binaries..."
          GOOS=linux GOARCH=mips GOMIPS=softfloat go build -trimpath -ldflags="-s -w" -o "release/natbypass-${TAG}-router-mips" ./cmd/natbypass-cli
          GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -trimpath -ldflags="-s -w" -o "release/natbypass-${TAG}-router-mipsle" ./cmd/natbypass-cli

          echo "==> 6. Building Android CLI..."
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o "release/natbypass-${TAG}-android-arm64" ./cmd/natbypass-cli

          echo "==> 7. Packaging Toolkit..."
          cp config.yaml.example release/config.yaml.example
          mkdir -p toolkit/natbypass-builder
          cp "release/NatBypass-Builder-${TAG}.exe" toolkit/natbypass-builder/NatBypass-Builder.exe
          cp config.yaml.example toolkit/natbypass-builder/config.yaml.example
          cp README.md toolkit/natbypass-builder/README.md
          python3 -c "import shutil; shutil.make_archive('release/NatBypass-Builder-Toolkit-${TAG}-windows', 'zip', 'toolkit')"
          rm -rf toolkit

          echo "==> All Built Files:"
          ls -lh release/

      - name: Publish Release via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "${TAG}" || gh release create "${TAG}" --title "Release ${TAG} - Pure Native Win32 Desktop App" --notes "Release ${TAG}"
          gh release upload "${TAG}" release/* --clobber
