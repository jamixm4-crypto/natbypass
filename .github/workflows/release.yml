name: Release / Publish Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install Zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build All Architectures
        run: |
          set -e
          mkdir -p release
          TAG_NAME="${{ github.ref_name }}"
          LDFLAGS="-s -w"

          # 1. Windows Native GUI (Win32 Desktop App) -> Primary release binaries
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS -H=windowsgui" -o "release/NatBypass.exe" ./cmd/natbypass-gui
          cp "release/NatBypass.exe" "release/NatBypass-${TAG_NAME}.exe"
          cp "release/NatBypass.exe" "release/natbypass-${TAG_NAME}-windows-amd64.exe"

          # 2. Windows CLI Daemon (Headless / Server)
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o "release/natbypass-cli-${TAG_NAME}-windows-amd64.exe" ./cmd/natbypass-cli

          # 3. Windows Builder GUI
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS -H=windowsgui" -o "release/NatBypass-Builder-${TAG_NAME}.exe" ./cmd/builder

          # 4. Linux Binaries
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o "release/natbypass-${TAG_NAME}-linux-amd64" ./cmd/natbypass-cli
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" -o "release/natbypass-${TAG_NAME}-linux-arm64" ./cmd/natbypass-cli

          # 5. Routers (MIPS / MIPSLE)
          CGO_ENABLED=0 GOOS=linux GOARCH=mips GOMIPS=softfloat go build -trimpath -ldflags "$LDFLAGS" -o "release/natbypass-${TAG_NAME}-router-mips" ./cmd/natbypass-cli
          CGO_ENABLED=0 GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -trimpath -ldflags "$LDFLAGS" -o "release/natbypass-${TAG_NAME}-router-mipsle" ./cmd/natbypass-cli

          # 6. Android
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" -o "release/natbypass-${TAG_NAME}-android-arm64" ./cmd/natbypass-cli

          # 7. Copy config template
          cp config.yaml.example release/config.yaml.example

          # 8. Build pre-packaged NatBypass-Builder-Toolkit.zip
          mkdir -p toolkit/natbypass-builder
          cp "release/NatBypass-Builder-${TAG_NAME}.exe" toolkit/natbypass-builder/NatBypass-Builder.exe
          cp config.yaml.example toolkit/natbypass-builder/config.yaml.example
          cp README.md toolkit/natbypass-builder/README.md
          (cd toolkit && zip -r "../release/NatBypass-Builder-Toolkit-${TAG_NAME}-windows.zip" natbypass-builder)
          rm -rf toolkit

          ls -lh release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: release/*
          draft: false
          prerelease: false
          generate_release_notes: true
