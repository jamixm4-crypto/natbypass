name: Release / Publish Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install zip tool
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build All Architectures
        run: |
          mkdir -p release
          TAG_NAME="${{ github.ref_name }}"
          LDFLAGS="-s -w"

          # Windows Binaries
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o release/natbypass-${TAG_NAME}-windows-amd64.exe ./cmd/natbypass-cli
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS} -H=windowsgui" -o release/NatBypass-${TAG_NAME}.exe ./cmd/natbypass-gui
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS} -H=windowsgui" -o release/NatBypass-Builder-${TAG_NAME}.exe ./cmd/builder

          # Linux Binaries
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o release/natbypass-${TAG_NAME}-linux-amd64 ./cmd/natbypass-cli
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o release/natbypass-${TAG_NAME}-linux-arm64 ./cmd/natbypass-cli

          # Routers (MIPS / MIPSLE)
          CGO_ENABLED=0 GOOS=linux GOARCH=mips GOMIPS=softfloat go build -trimpath -ldflags="${LDFLAGS}" -o release/natbypass-${TAG_NAME}-router-mips ./cmd/natbypass-cli
          CGO_ENABLED=0 GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -trimpath -ldflags="${LDFLAGS}" -o release/natbypass-${TAG_NAME}-router-mipsle ./cmd/natbypass-cli

          # Android
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o release/natbypass-${TAG_NAME}-android-arm64 ./cmd/natbypass-cli

          # Copy default config template
          cp config.yaml.example release/config.yaml.example

          # Build pre-packaged NatBypass-Builder-Toolkit.zip (Builder + Source code + Config + Docs)
          mkdir -p toolkit/natbypass-builder
          cp release/NatBypass-Builder-${TAG_NAME}.exe toolkit/natbypass-builder/NatBypass-Builder.exe
          cp -r cmd internal pkg docs config.yaml.example go.mod go.sum README.md toolkit/natbypass-builder/
          cd toolkit && zip -r ../release/NatBypass-Builder-Toolkit-${TAG_NAME}-windows.zip natbypass-builder && cd ..
          rm -rf toolkit

          ls -lh release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: release/*
          draft: false
          prerelease: false
          generate_release_notes: true