name: Build, Sign and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build-and-sign:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.12'
          cache: true

      - name: Compile Windows PE resources
        continue-on-error: true
        env:
          GOPROXY: "https://proxy.golang.org,direct"
        run: |
          go install github.com/tc-hib/go-winres@latest
          go-winres make --in winres/winres.json --out cmd/natbypass/rsrc
          go-winres make --in winres/winres.json --out cmd/natbypass-cli/rsrc
          go-winres make --in winres/winres.json --out cmd/natbypass-gui/rsrc

      - name: Build Windows Binaries
        env:
          CGO_ENABLED: '0'
          GOTOOLCHAIN: 'local'
          GOOS: windows
          GOARCH: amd64
        run: |
          if (Test-Path "build") { Remove-Item -Recurse -Force "build" }
          New-Item -ItemType Directory -Path "build" -Force | Out-Null
          $VERSION = "${{ github.ref_name }}"
          go build -trimpath -ldflags="-s -w -H=windowsgui -X main.Version=$VERSION" -o build/NatBypass.exe ./cmd/natbypass
          go build -trimpath -ldflags="-s -w -H=windowsgui -X main.Version=$VERSION" -o build/NatBypass-GUI.exe ./cmd/natbypass-gui
          go build -trimpath -ldflags="-s -w -X main.Version=$VERSION" -o build/natbypass-cli.exe ./cmd/natbypass-cli
          go build -trimpath -ldflags="-s -w -X main.Version=$VERSION" -o build/NatBypass-Diag.exe ./cmd/natbypass-diag

      - name: Install Cosign (Sigstore)
        uses: sigstore/cosign-installer@v3

      - name: Sign Windows Binary with Sigstore
        run: |
          cosign sign-blob --yes --output-signature build/NatBypass.exe.sig --output-certificate build/NatBypass.exe.pem build/NatBypass.exe

      - name: Build Linux Cross-Platform Binaries
        env:
          CGO_ENABLED: '0'
          GOTOOLCHAIN: 'local'
          GOOS: linux
        run: |
          $VERSION = "${{ github.ref_name }}"
          $env:GOARCH = "amd64"
          go build -trimpath -ldflags="-s -w -X main.Version=$VERSION" -o build/natbypass-linux-amd64 ./cmd/natbypass

          $env:GOARCH = "arm64"
          go build -trimpath -ldflags="-s -w -X main.Version=$VERSION" -o build/natbypass-linux-arm64 ./cmd/natbypass

          $env:GOARCH = "mipsle"
          $env:GOMIPS = "softfloat"
          go build -trimpath -ldflags="-s -w -X main.Version=$VERSION" -o build/natbypass-keenetic-mipsle ./cmd/natbypass
          Copy-Item build/natbypass-keenetic-mipsle build/natbypass-router-mipsle -Force

          $env:GOARCH = "mips"
          $env:GOMIPS = "softfloat"
          go build -trimpath -ldflags="-s -w -X main.Version=$VERSION" -o build/natbypass-router-mips ./cmd/natbypass

          $env:GOARCH = "arm"
          $env:GOARM = "7"
          go build -trimpath -ldflags="-s -w -X main.Version=$VERSION" -o build/natbypass-openwrt-armv7 ./cmd/natbypass
          Copy-Item build/natbypass-openwrt-armv7 build/natbypass-router-armv7 -Force

      - name: Upload Release Assets via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $TAG = "${{ github.ref_name }}"
          if ($TAG.Contains("-")) {
            gh release view $TAG; if ($LASTEXITCODE -ne 0) { gh release create $TAG --title "NatBypass $TAG" --notes "NatBypass $TAG — P2P Mesh & AmneziaWG 2.0 Client." --prerelease --draft=false }
          } else {
            gh release view $TAG; if ($LASTEXITCODE -ne 0) { gh release create $TAG --title "NatBypass $TAG" --notes "NatBypass $TAG — P2P Mesh & AmneziaWG 2.0 Client." --latest --draft=false }
          }
          Get-ChildItem -Path "build/*" | ForEach-Object {
            Write-Host "Uploading $($_.Name)..."
            for ($attempt=1; $attempt -le 5; $attempt++) {
              gh release upload $TAG $_.FullName --clobber
              if ($LASTEXITCODE -eq 0) { break }
              Start-Sleep -Seconds 3
            }
          }

      - name: Setup Python for manifest generator
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate mirror manifest and commit to repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          python scripts/gen_mirror_manifest.py --tag "${{ github.ref_name }}" --build-dir build --out-dir mirror/releases
          git add mirror/releases/
          $diff = git status --porcelain
          if ($diff) {
            git commit -m "chore(mirror): update release manifests for ${{ github.ref_name }} [skip ci]"
            git push origin main
          }
