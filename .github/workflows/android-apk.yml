name: Build Android APK (All-in-One)

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Android NDK & Licenses
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -f "$SDKM" ]; then
            yes | "$SDKM" --licenses || true
          else
            yes | sdkmanager --licenses || true
          fi
          
          if [ -d "$ANDROID_HOME/ndk" ] && [ "$(ls -A $ANDROID_HOME/ndk)" ]; then
            NDK_PATH=$(ls -d $ANDROID_HOME/ndk/* | sort -V | tail -n 1)
          elif [ -d "$ANDROID_SDK_ROOT/ndk" ] && [ "$(ls -A $ANDROID_SDK_ROOT/ndk)" ]; then
            NDK_PATH=$(ls -d $ANDROID_SDK_ROOT/ndk/* | sort -V | tail -n 1)
          else
            if [ -f "$SDKM" ]; then
              yes | "$SDKM" --install "ndk;26.1.10909125" "platforms;android-34" "build-tools;34.0.0"
            else
              yes | sdkmanager --install "ndk;26.1.10909125" "platforms;android-34" "build-tools;34.0.0"
            fi
            NDK_PATH="$ANDROID_HOME/ndk/26.1.10909125"
          fi
          echo "Selected NDK path: $NDK_PATH"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        run: |
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_NDK_HOME" >> local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon
          
          mkdir -p ../release_apk
          TAG="${GITHUB_REF_NAME}"
          if [ "$TAG" = "main" ] || [ "$TAG" = "master" ] || [ -z "$TAG" ]; then
            TAG=$(git tag -l "v*" | sort -V | tail -n 1)
            [ -z "$TAG" ] && TAG="v1.1.6"
          fi
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} ../release_apk/NatBypass-${TAG}.apk \;
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} ../release_apk/NatBypass.apk \;
          ls -lh ../release_apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NatBypass-Android-APK
          path: release_apk/*.apk

      - name: Attach APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "$TAG" = "main" ] || [ "$TAG" = "master" ] || [ -z "$TAG" ]; then
            TAG=$(git tag -l "v*" | sort -V | tail -n 1)
            [ -z "$TAG" ] && TAG="v1.1.6"
          fi
          # Create release if it doesn't exist yet
          gh release view "${TAG}" || gh release create "${TAG}" --title "NatBypass ${TAG}" --notes "NatBypass ${TAG} — P2P Mesh & AmneziaWG 2.0 Client." --target main || true
          for apk in ../release_apk/*.apk; do
            if [ -f "$apk" ]; then
              gh release upload "${TAG}" "$apk" --clobber || true
            fi
          done
          gh release edit "${TAG}" --latest --title "NatBypass ${TAG}" 2>/dev/null || true
