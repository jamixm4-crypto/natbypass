name: Build Android APK (All-in-One)

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Android NDK
        run: |
          # Detect or install NDK
          if [ -d "$ANDROID_SDK_ROOT/ndk" ] && [ "$(ls -A $ANDROID_SDK_ROOT/ndk)" ]; then
            NDK_PATH=$(ls -d $ANDROID_SDK_ROOT/ndk/* | sort -V | tail -n 1)
          else
            echo "Installing NDK..."
            yes | sdkmanager --install "ndk;25.2.9519653" "platforms;android-34" "build-tools;34.0.0"
            NDK_PATH="$ANDROID_SDK_ROOT/ndk/25.2.9519653"
          fi
          echo "Selected NDK path: $NDK_PATH"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Build Go Mobile AAR
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          export CGO_ENABLED=1
          gomobile init
          mkdir -p android/app/libs
          gomobile bind -v -target=android -androidapi=24 -o android/app/libs/natbypass.aar ./mobile
          ls -lh android/app/libs/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.6
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          
          mkdir -p ../release_apk
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} ../release_apk/NatBypass-v1.1.0.apk \;
          ls -lh ../release_apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NatBypass-Android-APK
          path: release_apk/*.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: release_apk/*.apk
