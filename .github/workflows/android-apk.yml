name: Build Android APK (All-in-One)

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure Android NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKM" ]; then
            SDKM="sdkmanager"
          fi
          yes | $SDKM --licenses || true
          
          # Install NDK 26.1 if not present
          if [ -d "$ANDROID_SDK_ROOT/ndk/26.1.10909125" ]; then
            NDK_PATH="$ANDROID_SDK_ROOT/ndk/26.1.10909125"
          elif [ -d "$ANDROID_SDK_ROOT/ndk" ] && [ "$(ls -A $ANDROID_SDK_ROOT/ndk)" ]; then
            NDK_PATH=$(ls -d $ANDROID_SDK_ROOT/ndk/* | sort -V | tail -n 1)
          else
            yes | $SDKM --install "ndk;26.1.10909125" "platforms;android-34" "build-tools;34.0.0" || true
            NDK_PATH="$ANDROID_SDK_ROOT/ndk/26.1.10909125"
          fi
          echo "Selected NDK path: $NDK_PATH"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Go Mobile Core (AAR)
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          export GOPROXY="https://proxy.golang.org,direct"
          go get golang.org/x/mobile/bind@latest
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-$NDK_PATH}"
          export NDK_HOME="${ANDROID_NDK_HOME}"
          gomobile init

          mkdir -p android/app/libs
          for attempt in 1 2 3; do
            echo "Building mobile.aar (attempt $attempt)..."
            if gomobile bind -v -target=android/arm64,android/arm,android/amd64 -androidapi=24 -o android/app/libs/mobile.aar ./mobile; then
              break
            fi
            echo "Attempt $attempt failed, retrying in 5 seconds..."
            sleep 5
          done
          ls -lh android/app/libs/
          test -f android/app/libs/mobile.aar || (echo "ERROR: mobile.aar was not created!" && exit 1)

      - name: Build Android APK
        run: |
          cd android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "ndk.dir=$ANDROID_NDK_HOME" >> local.properties
          chmod +x gradlew

          TAG="${GITHUB_REF_NAME}"
          if [ "$TAG" = "main" ] || [ "$TAG" = "master" ] || [ -z "$TAG" ]; then
            TAG=$(git tag -l "v*" | sort -V | tail -n 1)
            [ -z "$TAG" ] && TAG="v1.3.9"
          fi

          VERSION_NAME="${TAG#v}"
          V_MAJOR=$(echo "$VERSION_NAME" | cut -d. -f1)
          V_MINOR=$(echo "$VERSION_NAME" | cut -d. -f2)
          V_PATCH=$(echo "$VERSION_NAME" | cut -d. -f3)
          V_MAJOR=${V_MAJOR:-1}
          V_MINOR=${V_MINOR:-3}
          V_PATCH=${V_PATCH:-9}
          VERSION_CODE=$((V_MAJOR * 10000 + V_MINOR * 100 + V_PATCH))

          echo "Building Android APK for version $VERSION_NAME (versionCode: $VERSION_CODE)..."
          ./gradlew assembleDebug -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE" --stacktrace --no-daemon
          
          mkdir -p ../release_apk
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} ../release_apk/NatBypass-${TAG}.apk \;
          ls -lh ../release_apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NatBypass-Android-APK
          path: release_apk/*.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "$TAG" = "main" ] || [ "$TAG" = "master" ] || [ -z "$TAG" ]; then
            TAG=$(git tag -l "v*" | sort -V | tail -n 1)
            [ -z "$TAG" ] && TAG="v1.5.2"
          fi
          echo "Attaching Android APK to release $TAG..."
          
          # Даем время параллельному воркфлоу релиза завершить публикацию
          sleep 5
          
          gh release view "${TAG}" || gh release create "${TAG}" --title "NatBypass ${TAG}" --notes "NatBypass ${TAG} — P2P Mesh & AmneziaWG 2.0 Client." --draft=false --latest || true
          
          for apk in release_apk/*.apk; do
            if [ -f "$apk" ]; then
              fname=$(basename "$apk")
              echo "Uploading $fname..."
              uploaded=0
              for attempt in 1 2 3 4 5; do
                if gh release upload "${TAG}" "$apk" --clobber; then
                  echo "Successfully uploaded $fname on attempt $attempt"
                  uploaded=1
                  break
                else
                  echo "Upload attempt $attempt failed, retrying in 6s..."
                  sleep 6
                fi
              done
              if [ $uploaded -eq 0 ]; then
                echo "Warning: Could not upload $fname after 5 attempts"
              fi
            fi
          done
          gh release edit "${TAG}" --draft=false --latest --title "NatBypass ${TAG}" 2>/dev/null || true

