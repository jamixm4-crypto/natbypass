name: Cleanup Old Releases

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old releases except latest 3
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            console.log(`Found ${releases.length} releases`);
            const sorted = releases.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const keep = sorted.slice(0, 3);
            const keepTags = new Set(keep.map(r => r.tag_name));
            console.log(`Keeping releases: ${Array.from(keepTags).join(', ')}`);

            for (const release of sorted.slice(3)) {
              console.log(`Deleting old release: ${release.name} (${release.tag_name}) ID: ${release.id}`);
              try {
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.id,
                });
                console.log(`Deleted release ${release.tag_name}`);
              } catch (e) {
                console.error(`Failed to delete release ${release.tag_name}: ${e.message}`);
              }
            }
