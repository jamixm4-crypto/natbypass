name: Cleanup Old Releases

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all previous releases except the single latest
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            console.log(`Found ${releases.length} releases`);
            if (releases.length <= 1) {
              console.log('Only 1 or 0 releases exist, nothing to clean up.');
              return;
            }

            const sorted = releases.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const latest = sorted[0];
            console.log(`Keeping ONLY latest release: ${latest.name} (${latest.tag_name})`);

            for (const release of sorted.slice(1)) {
              console.log(`Deleting old release: ${release.name} (${release.tag_name}) ID: ${release.id}`);
              try {
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.id,
                });
                console.log(`✓ Deleted release ${release.tag_name}`);
              } catch (e) {
                console.error(`Failed to delete release ${release.tag_name}: ${e.message}`);
              }
            }

