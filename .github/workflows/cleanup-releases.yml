name: Cleanup Old Releases

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old releases except latest
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            console.log(`Found ${releases.length} releases`);
            for (const release of releases) {
              if (release.tag_name !== 'v1.4.6') {
                console.log(`Deleting release: ${release.name} (${release.tag_name}) ID: ${release.id}`);
                try {
                  await github.rest.repos.deleteRelease({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    release_id: release.id,
                  });
                  console.log(`Deleted release ${release.tag_name}`);
                } catch (e) {
                  console.error(`Failed to delete release ${release.tag_name}: ${e.message}`);
                }
              } else {
                console.log(`Keeping latest release: ${release.tag_name}`);
              }
            }
