name: Cleanup Releases and Workflow Runs

on:
  push:
    paths:
      - '.github/workflows/cleanup-releases.yml'
      - '.github/scripts/cleanup.js'
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0' # Weekly at 03:00 UTC on Sunday

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Repository & Releases Cleanup
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const script = require('./.github/scripts/cleanup.js');
            await script({ github, context });

      - name: Setup Python for Manifest Regeneration
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate Mirror Manifests and Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          python scripts/gen_mirror_manifest.py --tag "v1.9.225-beta2" --out-dir mirror/releases
          git add mirror/releases/
          git commit -m "Update mirror manifests with detailed changelog [skip ci]" || echo "No manifest changes to commit"
          git push origin main || echo "Push failed or nothing to push"
