name: CI / Build & Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Run Unit Tests
        run: go test -v -timeout 300s ./...

      - name: Run Fuzz Smoke Tests
        run: |
          go test -fuzz=Fuzz -fuzztime=5s ./internal/network || true
          go test -fuzz=Fuzz -fuzztime=5s ./internal/signaling || true
          go test -fuzz=Fuzz -fuzztime=5s ./internal/peer || true

  security-scan:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        continue-on-error: true
        with:
          version: v1.64.5
          args: --timeout=5m --disable-all -E govet,staticcheck

      - name: Run Gosec Security Scanner
        continue-on-error: true
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          $(go env GOPATH)/bin/gosec -quiet -no-fail ./... || true

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'

  build-matrix:
    name: Cross-Compile Matrix
    needs: [test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: windows
            arch: amd64
            ext: .exe
            gomips: ""
          - os: linux
            arch: amd64
            ext: ""
            gomips: ""
          - os: linux
            arch: arm64
            ext: ""
            gomips: ""
          - os: linux
            arch: mips
            ext: ""
            gomips: softfloat
          - os: linux
            arch: mipsle
            ext: ""
            gomips: softfloat
          - os: android
            arch: arm64
            ext: ""
            gomips: ""
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Build Binary
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GOMIPS: ${{ matrix.gomips }}
        run: |
          mkdir -p bin
          OUT_NAME="natbypass-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}"
          go build -trimpath -ldflags="-s -w -X main.Version=${{ github.ref_name }}" -o "bin/$OUT_NAME" ./cmd/natbypass-cli
          ls -lh bin/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: natbypass-${{ matrix.os }}-${{ matrix.arch }}
          path: bin/*